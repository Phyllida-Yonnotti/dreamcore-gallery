<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM CONTROL CENTER</title>
    <style>
        body { background-color: #008080; font-family: 'Courier New', monospace; padding: 20px; color: #000; }
        .window { width: 400px; background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #808080; border-bottom-color: #808080; margin: 0 auto; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: white; padding: 4px; font-weight: bold; font-size: 0.9rem; }
        .window-body { padding: 15px; }
        .section-box { border: 2px inset #fff; padding: 10px; margin-bottom: 15px; background-color: #d8d8d8; }
        .label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .btn { background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; padding: 4px 12px; cursor: pointer; font-size: 0.85rem; }
        .btn:active { border: 2px inset #fff; }
        .btn-block { width: 100%; padding: 8px; font-weight: bold; margin-top: 10px; }
        textarea { width: 95%; border: 2px inset #fff; padding: 4px; font-family: inherit; resize: none; }
        #status-area { margin-top: 15px; font-size: 0.8rem; border-top: 1px dotted #808080; padding-top: 5px; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span class="title-bar-text">🔒 SYSTEM_AUTH.EXE - 矩阵用户中心</span>
    </div>
    <div class="window-body">
        
        <div class="section-box">
            <label class="label">👤 管理员标识 (Username)</label>
            <input type="text" id="admin-username" style="width:95%; padding:4px; border:2px inset #fff; margin-bottom:10px;" placeholder="输入用户名">
            
            <label class="label">🔑 矩阵效验暗号 (Password)</label>
            <input type="password" id="admin-password" style="width:95%; padding:4px; border:2px inset #fff; margin-bottom:10px;" placeholder="输入密码">
            
            <button class="btn" style="background-color: #dfdfdf; font-size: 0.75rem; padding: 2px 6px;" onclick="registerAccount()">🆕 注册此新账号</button>
        </div>

        <div class="section-box">
            <label class="label">1. 选择并载入新的记忆切片 (照片)</label>
            <div class="file-input-container" style="position:relative; margin-bottom:10px;">
                <button class="btn" type="button" id="file-label">📂 选择图片文件...</button>
                <input type="file" id="image-file" accept="image/*" onchange="updateFileLabel(this)" style="position:absolute; left:0; top:0; opacity:0; width:100%; height:100%; cursor:pointer;">
            </div>

            <label class="label">2. 植入潜意识关联文字 (文案)</label>
            <textarea id="caption-text" rows="3" placeholder="例如：谁在有雾的午后等过你？"></textarea>
        </div>

        <button class="btn btn-block" onclick="uploadMemory()">💾 验证身份并写入核心矩阵</button>
        <div id="status-area">状态: 🟢 等待指令。</div>
    </div>
</div>

<script>
    // 动态更新选择的文件名
    function updateFileLabel(input) {
        const label = document.getElementById('file-label');
        label.innerText = input.files.length > 0 ? `📄 已载入: ${input.files[0].name}` : `📂 选择图片文件...`;
    }

    // ⚡ 自主注册函数
    async function registerAccount() {
        const username = document.getElementById('admin-username').value;
        const password = document.getElementById('admin-password').value;
        const status = document.getElementById('status-area');

        if (!username || !password) { status.innerText = "❌ 错误: 请先填写要注册的用户名和密码！"; return; }
        status.innerText = "⚡ 正在向用户矩阵申请注册...";

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'register', username, password })
            });
            const result = await response.json();
            if (response.ok && result.success) {
                status.style.color = "green";
                status.innerText = `🎉 账号 [${username}] 注册成功！现在可以直接在下方填写并上传。`;
            } else {
                throw new Error(result.error || "注册失败");
            }
        } catch (error) {
            status.style.color = "red";
            status.innerText = `❌ 注册终止: ${error.message}`;
        }
    }

    // 🚀 登录并压缩上传函数
    async function uploadMemory() {
        const username = document.getElementById('admin-username').value;
        const password = document.getElementById('admin-password').value;
        const fileInput = document.getElementById('image-file');
        const caption = document.getElementById('caption-text').value;
        const status = document.getElementById('status-area');

        if (!username || !password) { status.innerText = "❌ 错误: 用户名和密码不能为空！"; return; }
        if (fileInput.files.length === 0) { status.innerText = "❌ 错误: 请选择图片！"; return; }
        if (!caption) { status.innerText = "❌ 错误: 请填写文案！"; return; }

        status.style.color = "black";
        status.innerText = "🎨 正在进行像素重组(压缩中)...";
        const file = fileInput.files[0];
        
        // HTML5 Canvas 压缩核心
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_WIDTH = 1200; // 限制最大宽度 1200px
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            // 0.7 代表 70% 质量，兼顾清晰度与复古压痕感，体积暴减
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
            sendToServer(compressedBase64);
        };

        async function sendToServer(base64Content) {
            status.innerText = "🚀 正在提交身份验证并传输数据...";
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'upload', 
                        username: username,
                        password: password,
                        caption: caption,
                        fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg", // 统一压成 jpg 后缀
                        fileContent: base64Content
                    })
                });

                if (!response.ok) {
                    const textError = await response.text();
                    if (textError.includes("Too Large")) throw new Error("照片体积过大");
                    throw new Error(`服务器拒绝: 代码 ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    status.style.color = "green";
                    status.innerText = "🎉 验证成功，数据已成功写入 GitHub 账本！网页即将刷新。";
                    fileInput.value = "";
                    document.getElementById('caption-text').value = "";
                    document.getElementById('file-label').innerText = `📂 选择图片文件...`;
                } else {
                    throw new Error(result.error || "认证失败");
                }
            } catch (error) {
                status.style.color = "red";
                status.innerText = `❌ 拒绝访问: ${error.message}`;
            }
        }
    }
</script>
</body>
</html>
