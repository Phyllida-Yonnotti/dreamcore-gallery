<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is this a dream?</title>
  <style>
    body {
      background-color: #000000;
      color: #00ffcc;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
    }

    .dream-text {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ffcc;
      animation: blink 2s infinite;
    }

    .window-container {
      background-color: #c0c0c0;
      border: 3px solid;
      border-color: #fff #808080 #808080 #fff;
      width: 90%;
      max-width: 500px;
      padding: 3px;
      box-shadow: 10px 10px 0px rgba(0, 255, 204, 0.3);
    }

    .window-header {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-close {
      background: #c0c0c0;
      border: 1px solid;
      border-color: #fff #404040 #404040 #fff;
      padding: 0px 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .window-body {
      padding: 15px;
      background: #5a5a5a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-frame {
      background: #000;
      padding: 10px;
      border: 2px inset #fff;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .photo-frame img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.2) saturate(0.8) blur(0.3px);
      transition: all 0.5s ease;
    }

    .photo-frame img:hover {
      filter: contrast(2) invert(0.1) hue-rotate(90deg);
    }

    .photo-caption {
      color: #ff00ff;
      margin-top: 10px;
      font-size: 0.85rem;
      text-shadow: 0 0 5px #ff00ff;
    }

    .nav-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #fff #404040 #404040 #fff;
      padding: 5px 15px;
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:active {
      border-color: #404040 #fff #fff #404040;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    /* 🟢 开场全屏遮罩样式 */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      /* 保证遮罩层在最最最上层 */
      background-color: #050508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* 淡出过渡效果：1秒内完成淡出 */
      transition: opacity 1s ease-out, visibility 1s ease-out;
    }

    /* 开场图片：铺满全屏，按比例裁剪 */
    .splash-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 保证图片不变形且充满全屏 */
      filter: brightness(0.6);
      /* 稍微调暗一点，显出高级感 */
      animation: zoomEffect 3s ease-out forwards;
      /* 图片缓慢放大的微动效 */
    }

    /* 覆盖在图片上的文字提示 */
    .splash-title {
      position: relative;
      z-index: 2;
      color: #63e6be;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(99, 230, 190, 0.8);
      animation: pulseText 2s infinite ease-in-out;
    }

    /* 淡出时的触发类 */
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* 防止淡出后挡住点击事件 */
    }

    /* 微动效：镜头慢慢推进 */
    @keyframes zoomEffect {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }
    }

    @keyframes pulseText {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <!-- 🟢 开场全屏大图遮罩层 -->
  <div id="splash-screen">
    <!-- 替换下面 src 的图片链接为你想要的开场大图，例如你的艺术图或梦境图 -->
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80" alt="Intro"
      class="splash-img">
    <div class="splash-title">// ENTERING THE DREAMSCAPE //</div>
  </div>

  <audio id="bgm" src="music/lofi/0001.m4a" loop></audio>

  <div class="dream-text">
    你记得这里吗？<br>
    [ 或者是你迷失的那天 ]
  </div>

  <div class="window-container">
    <div class="window-header">
      <span>Memory_Viewer.exe</span>
      <button class="window-close" onclick="alert('你无法逃离这里。')">X</button>
    </div>
    <div class="window-body">
      <div class="photo-frame">
        <img id="gallery" src="images/pic1.jpg" alt="dreamcore">
        <div class="photo-caption" id="caption">这是你醒来前看到的最后一幕。</div>
      </div>

      <div class="nav-buttons">
        <button class="btn" onclick="changeMemory(-1)">◀ 上一段</button>
        <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 播放声音</button>
        <button class="btn" onclick="changeMemory(1)">下一段 ▶</button>
      </div>
    </div>
  </div>

  <script>
    /// read pics
    let memories = [];

    fetch('data.json')
      .then(response => {
        if (!response.ok) throw new Error("无法读取账本");
        return response.json();
      })
      .then(data => {
        memories = data; // 拿到完整的照片和文案数组

        // 如果账本里有数据，渲染第一张图到页面上
        if (memories.length > 0) {
          // 假设你的图片标签 id 是展示用的展示框
          const imgElement = document.getElementById('gallery-image');
          const captionElement = document.getElementById('gallery-caption');

          if (imgElement) imgElement.src = memories[0].url;
          if (captionElement) captionElement.innerText = memories[0].text;

          // 💡 如果你以前的代码有记录上传者，你甚至可以利用 item.by 把它显示出来
          console.log(`这张图是由 ${memories[0].by || '神秘人'} 载入的`);
        }
      })
      .catch(err => {
        console.error("加载失败: ", err);
      });

    /// slide images
    function changeMemory(direction) {
      if (memories.length === 0) return;

      currentIndex += direction;
      if (currentIndex >= memories.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = memories.length - 1;

      imgElement.style.opacity = 0.3;

      setTimeout(() => {
        imgElement.src = memories[currentIndex].url;
        captionElement.innerText = memories[currentIndex].text;
        imgElement.style.opacity = 1;
      }, 150);
    }

    // music player
    let isPlaying = false;
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (!isPlaying) {
        bgm.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = "⏸ 暂停声音";
          bgm.playbackRate = 0.85;
        }).catch(err => {
          console.log("播放失败，需要用户交互:", err);
        });
      } else {
        bgm.pause();
        isPlaying = false;
        musicBtn.innerText = "🎵 播放声音";
      }
    }

    // 🟢 开场遮罩自动淡出逻辑
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen');

      // 页面加载完成后，等待 2 秒（2000毫秒），然后开始淡出
      setTimeout(() => {
        splash.classList.add('fade-out');
      }, 2000);
    });
  </script>
</body>

</html>
