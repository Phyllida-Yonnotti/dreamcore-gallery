<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is this a dream?</title>
    <style>
        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }

        .dream-text {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00ffcc;
            animation: blink 2s infinite;
        }

        .window-container {
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            width: 90%;
            max-width: 500px;
            padding: 3px;
            box-shadow: 10px 10px 0px rgba(0, 255, 204, 0.3);
        }

        .window-header {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-close {
            background: #c0c0c0;
            border: 1px solid;
            border-color: #fff #404040 #404040 #fff;
            padding: 0px 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .window-body {
            padding: 15px;
            background: #5a5a5a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .photo-frame {
            background: #000;
            padding: 10px;
            border: 2px inset #fff;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.2) saturate(0.8) blur(0.3px); 
            transition: all 0.5s ease;
        }

        .photo-frame img:hover {
            filter: contrast(2) invert(0.1) hue-rotate(90deg);
        }

        .photo-caption {
            color: #ff00ff;
            margin-top: 10px;
            font-size: 0.85rem;
            text-shadow: 0 0 5px #ff00ff;
        }

        .nav-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;
            padding: 5px 15px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:active {
            border-color: #404040 #fff #fff #404040;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    
    <audio id="bgm" src="music/lofi/0001.m4a" loop></audio>
    
    <div class="dream-text">
        你记得这里吗？<br>
        [ 或者是你迷失的那天 ]
    </div>

    <div class="window-container">
        <div class="window-header">
            <span>Memory_Viewer.exe</span>
            <button class="window-close" onclick="alert('你无法逃离这里。')">X</button>
        </div>
        <div class="window-body">
            <div class="photo-frame">
                <img id="gallery" src="images/pic1.jpg" alt="dreamcore">
                <div class="photo-caption" id="caption">这是你醒来前看到的最后一幕。</div>
            </div>
            
            <div class="nav-buttons">
                <button class="btn" onclick="changeMemory(-1)">◀ 上一段</button>
                <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 播放声音</button>
                <button class="btn" onclick="changeMemory(1)">下一段 ▶</button>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ 在这里配置你的照片名字（必须和 images 文件夹里的完全一致）和文案
        const memories = [
            {
                url: "images/holiday/thai/00000001.JPG",
                text: "这是你醒来前看到的最后一幕。"
            },
            {
                url: "images/holiday/thai/00000002.JPG",
                text: "谁在有雾的午后等过你？"
            },
            {
                url: "images/holiday/thai/00000003.JPG",
                text: "没有人的地方，才是最安全的。"
            }
        ];

        let currentIndex = 0;

        function changeMemory(direction) {
            currentIndex += direction;
            if (currentIndex >= memories.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = memories.length - 1;

            const imgElement = document.getElementById('gallery');
            const captionElement = document.getElementById('caption');

            imgElement.style.opacity = 0.3;
            
            setTimeout(() => {
                imgElement.src = memories[currentIndex].url;
                captionElement.innerText = memories[currentIndex].text;
                imgElement.style.opacity = 1;
            }, 150);
        }

        // music player
        let isPlaying = false;
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        
        function toggleMusic() {
            if (!isPlaying) {
                bgm.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "⏸ 暂停声音";
                }).catch(err => {
                    console.log("播放失败，需要用户交互:", err);
                });
            } else {
                bgm.pause();
                isPlaying = false;
                musicBtn.innerText = "🎵 播放声音";
            }
        }
    </script>
</body>
</html>
