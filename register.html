<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM REGISTER</title>
    <style>
        /* 复用登录页面的复古样式 */
        body { background-color: #008080; font-family: 'Courier New', monospace; padding: 20px; color: #000; margin: 0; }
        .navbar { position: absolute; top: 10px; right: 10px; z-index: 999; }
        .hamburger-btn { background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .menu-dropdown { display: none; position: absolute; right: 0; top: 32px; background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; width: 120px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .menu-dropdown a { display: block; padding: 6px 12px; color: black; text-decoration: none; font-size: 0.85rem; }
        .menu-dropdown a:hover { background-color: #000080; color: white; }
        .window { width: 360px; background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #808080; border-bottom-color: #808080; margin: 100px auto 0 auto; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: white; padding: 4px; font-weight: bold; font-size: 0.9rem; }
        .window-body { padding: 15px; }
        .section-box { border: 2px inset #fff; padding: 10px; margin-bottom: 15px; background-color: #d8d8d8; }
        .label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .btn { background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; padding: 4px 12px; cursor: pointer; font-size: 0.85rem; }
        .btn-block { width: 100%; padding: 6px; font-weight: bold; margin-top: 10px; }
        input { width: 93%; border: 2px inset #fff; padding: 4px; font-family: inherit; margin-bottom: 10px; }
        #status-area { margin-top: 10px; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<div class="navbar">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="menu-dropdown" id="menuBox">
        <a href="upload.html">📂 上传控制台</a>
        <a href="admin.html">🔑 注册与登录</a>
    </div>
</div>

<div class="window">
    <div class="title-bar">
        <span class="title-bar-text">🆕 REGISTER.EXE - 申请加入矩阵</span>
    </div>
    <div class="window-body">
        <div class="section-box">
            <label class="label">👤 设定新管理员标识 (Username)</label>
            <input type="text" id="reg-username" placeholder="想一个用户名">
            
            <label class="label">🔑 设定矩阵安全效验暗号 (Password)</label>
            <input type="password" id="reg-password" placeholder="设一个密码">
            
            <button class="btn btn-block" onclick="registerAccount()">✍️ 递交注册申请</button>
        </div>
        <div style="text-align: center;"><a href="admin.html" style="font-size:0.8rem; color:#000;">已有账号？返回登录</a></div>
        <div id="status-area"></div>
    </div>
</div>

<script>
    function toggleMenu() {
        const menu = document.getElementById('menuBox');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    async function registerAccount() {
        const username = document.getElementById('reg-username').value;
        const password = document.getElementById('reg-password').value;
        const status = document.getElementById('status-area');

        if (!username || !password) { status.innerText = "❌ 账号和密码不能为空！"; return; }
        status.style.color = "black";
        status.innerText = "⚡ 正在向 Supabase 申请空位...";

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'register', username, password })
            });
            const result = await response.json();
            if (response.ok && result.success) {
                status.style.color = "green";
                status.innerText = `🎉 注册成功！1秒后自动前往登录大门...`;
                setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
            } else {
                throw new Error(result.error || "注册失败");
            }
        } catch (error) {
            status.style.color = "red";
            status.innerText = `❌ 注册终止: ${error.message}`;
        }
    }
</script>
</body>
</html>
