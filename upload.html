<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MEMORY UPLOAD CONTROL</title>
    <style>
        /* 复用经典的 Win95 / 灰绿底样式 */
        body { background-color: #008080; font-family: 'Courier New', monospace; padding: 20px; color: #000; margin: 0; }
        .navbar { position: absolute; top: 10px; right: 10px; z-index: 999; }
        .hamburger-btn { background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .menu-dropdown { display: none; position: absolute; right: 0; top: 32px; background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; width: 120px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .menu-dropdown a { display: block; padding: 6px 12px; color: black; text-decoration: none; font-size: 0.85rem; }
        .menu-dropdown a:hover { background-color: #000080; color: white; }
        .window { width: 400px; background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #808080; border-bottom-color: #808080; margin: 80px auto 0 auto; box-shadow: 2px 2px 10 rgba(0,0,0,0.5); }
        .title-bar { background: linear-gradient(90deg, #800080, #da70d6); color: white; padding: 4px; font-weight: bold; font-size: 0.9rem; }
        .window-body { padding: 15px; }
        .section-box { border: 2px inset #fff; padding: 10px; margin-bottom: 15px; background-color: #d8d8d8; }
        .label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .btn { background-color: #c0c0c0; border: 2px solid #fff; border-right-color: #555; border-bottom-color: #555; padding: 4px 12px; cursor: pointer; font-size: 0.85rem; }
        .btn-block { width: 100%; padding: 8px; font-weight: bold; margin-top: 10px; }
        textarea { width: 94%; border: 2px inset #fff; padding: 4px; font-family: inherit; resize: none; }
        #status-area { margin-top: 15px; font-size: 0.8rem; text-align: center; border-top: 1px dotted #808080; padding-top: 5px; }
    </style>
</head>
<body>

<div class="navbar">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="menu-dropdown" id="menuBox">
        <a href="upload.html">📂 上传控制台</a>
        <a href="admin.html">🔑 注册与登录</a>
    </div>
</div>

<div class="window">
    <div class="title-bar">
        <span class="title-bar-text">📂 MEMORY_CORE.EXE - 记忆载入端</span>
    </div>
    <div class="window-body">
        <div style="font-size:0.75rem; margin-bottom: 10px; color:#555;" id="user-tag">当前操纵者: 未登录</div>
        
        <div class="section-box">
            <label class="label">1. 选择并载入新的记忆切片 (照片)</label>
            <div class="file-input-container" style="position:relative; margin-bottom:10px;">
                <button class="btn" type="button" id="file-label">📂 选择图片文件...</button>
                <input type="file" id="image-file" accept="image/*" onchange="updateFileLabel(this)" style="position:absolute; left:0; top:0; opacity:0; width:100%; height:100%; cursor:pointer;">
            </div>

            <label class="label">2. 植入潜意识关联文字 (文案)</label>
            <textarea id="caption-text" rows="4" placeholder="谁在有雾的午后等过你？"></textarea>
        </div>

        <button class="btn btn-block" onclick="uploadMemory()">💾 验证身份并写入核心矩阵</button>
        <div id="status-area">状态: 🟢 矩阵连接安全。</div>
    </div>
</div>

<script>
    // 🔒 自动安检：如果发现浏览器缓存里没有账号密码，一秒都不让他多呆，直接踢回登录页
    const savedUser = sessionStorage.getItem('dc_user');
    const savedPwd = sessionStorage.getItem('dc_pwd');
    if (!savedUser || !savedPwd) {
        alert("🔒 矩阵未授权！请先去完成登录。");
        window.location.href = 'admin.html';
    } else {
        document.getElementById('user-tag').innerText = `当前操纵者: 🟢 ${savedUser}`;
    }

    function toggleMenu() {
        const menu = document.getElementById('menuBox');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function updateFileLabel(input) {
        const label = document.getElementById('file-label');
        label.innerText = input.files.length > 0 ? `📄 已载入: ${input.files[0].name}` : `📂 选择图片文件...`;
    }

    async function uploadMemory() {
        const fileInput = document.getElementById('image-file');
        const caption = document.getElementById('caption-text').value;
        const status = document.getElementById('status-area');

        if (fileInput.files.length === 0) { status.innerText = "❌ 错误: 请选择图片！"; return; }
        if (!caption) { status.innerText = "❌ 错误: 请填写文案！"; return; }

        status.style.color = "black";
        status.innerText = "🎨 正在进行像素重组(前端智能压缩中)...";
        const file = fileInput.files[0];
        
        // Canvas 前端无损比例压缩
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_WIDTH = 1200;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
            sendToServer(compressedBase64);
        };

        async function sendToServer(base64Content) {
            status.innerText = "🚀 正在通过加密信道写入 GitHub 账本...";
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'upload', 
                        username: savedUser, // 💡 自动使用刚才登录存好的名字
                        password: savedPwd,  // 💡 自动使用刚才登录存好的密码
                        caption: caption,
                        fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
                        fileContent: base64Content
                    })
                });

                if (!response.ok) throw new Error(`服务器拒绝: 代码 ${response.status}`);
                const result = await response.json();

                if (result.success) {
                    status.style.color = "green";
                    status.innerText = "🎉 矩阵重编成功！10秒后大厅会自动刷新呈现。";
                    fileInput.value = "";
                    document.getElementById('caption-text').value = "";
                    document.getElementById('file-label').innerText = `📂 选择图片文件...`;
                } else {
                    throw new Error(result.error || "认证失败");
                }
            } catch (error) {
                status.style.color = "red";
                status.innerText = `❌ 拒绝访问: ${error.message}`;
            }
        }
    }
</script>
</body>
</html>
